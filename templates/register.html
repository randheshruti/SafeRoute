{% extends "base.html" %}
{% block title %}Register - SafeRoute{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Create account</h2>
  <form method="post">
    <label>Name <input type="text" name="name" required autofocus></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Password (min 6 characters) <input type="password" name="password" minlength="6" required></label>
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
